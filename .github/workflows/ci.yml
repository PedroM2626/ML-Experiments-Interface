name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install base deps
        run: |
          python -m pip install --upgrade pip
          pip install streamlit pandas numpy scikit-learn matplotlib seaborn plotly joblib python-dotenv pytest
      - name: Collect tests
        run: python -m pytest --collect-only -q
      - name: Run fast tests (time-series + pyramid smoke + studio system)
        run: python -m pytest MLine/tests/test_time_series.py "Flexible Ensemble Pyramid/tests/test_pyramid_smoke.py" "sagemaker based/tests/test_system.py" -q -p no:warnings
      - name: Run full suite
        run: python -m pytest -q -p no:warnings
      - name: Streamlit sanity
        run: python -m streamlit --help
